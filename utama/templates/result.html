<template>
  <div class="container">
    <h1>Struk Scanner dengan Nuxt.js</h1>
    <div class="upload-area" 
         :class="{ 'drag-over-active': isDragging }"
         @dragover.prevent="onDragOver" 
         @dragleave="onDragLeave" 
         @drop.prevent="onDrop">
      <input type="file" id="fileInput" ref="fileInput" accept="image/*" multiple @change="onFileChange" style="display: none;">
      <label for="fileInput" class="upload-button">Pilih Gambar Struk</label>
      <p>Atau seret & lepas gambar di sini</p>
      <div v-if="selectedFiles.length > 0" class="image-preview-container">
        <img v-for="(file, index) in selectedFiles" :key="index" :src="file.preview" class="image-preview">
      </div>
    </div>
    <button @click="processStruks" :disabled="!selectedFiles.length || loading">
      {{ loading ? 'Memproses...' : 'Proses Struk' }}
    </button>

    <div v-if="loading" class="loading-indicator">
        <div class="spinner"></div>
        <p>Memproses...</p>
    </div>

    <div v-if="errorMessage" class="error-message">{{ errorMessage }}</div>

    <div v-if="results.length > 0" class="results-container">
      <div v-for="(result, index) in results" :key="index" class="result-card">
        <template v-if="result.error">
          <h3>Hasil Struk {{ index + 1 }} (Error)</h3>
          <p class="error-message">Error: {{ result.error }}</p>
        </template>
        <template v-else>
          <h3>Hasil Struk {{ index + 1 }}</h3>
          <p><strong>Invoice Number:</strong> {{ result.invoice_number || 'N/A' }}</p>
          <p><strong>Tanggal:</strong> {{ result.tanggal || 'N/A' }}</p>
          <h4>Merchant</h4>
          <p><strong>Nama Toko:</strong> {{ result.merchant.name || 'N/A' }}</p>
          <p><strong>Alamat:</strong> {{ result.merchant.address || 'N/A' }}</p>
          <p><strong>Telepon:</strong> {{ result.merchant.phone || 'N/A' }}</p>
          <p><strong>Email:</strong> {{ result.merchant.email || 'N/A' }}</p>
          <h4>Daftar Barang</h4>
          <ul>
            <li v-for="(item, itemIndex) in result.items" :key="itemIndex">
                <span><strong>Nama OCR:</strong> {{ item.ocr_result.name || 'N/A' }}</span>
                <span><strong>Qty:</strong> {{ item.ocr_result.quantity || 'N/A' }}</span>
                <span><strong>Harga Satuan:</strong> {{ formatCurrency(item.ocr_result.price) || 'N/A' }}</span>
                <span><strong>Subtotal:</strong> {{ formatCurrency(item.ocr_result.total) || 'N/A' }}</span>
                <span><strong>Akurasi:</strong> {{ item.ocr_result.accuration !== null ? (item.ocr_result.accuration * 100).toFixed(2) + '%' : 'N/A' }}</span>
                <template v-if="item.id !== null">
                    <span><strong>Matched ID:</strong> {{ item.id }}</span>
                    <span><strong>Matched Name:</strong> {{ item.name }}</span>
                </template>
                <template v-else>
                    <span style="color: red; font-weight: bold;">Tidak Cocok</span>
                </template>
            </li>
          </ul>
          <p><strong>Grand Total:</strong> {{ formatCurrency(result.grand_total) || 'N/A' }}</p>
        </template>
      </div>
    </div>
  </div>
</template>

<script setup>
import { ref } from 'vue';

const selectedFiles = ref([]);
const results = ref([]);
const loading = ref(false);
const errorMessage = ref('');
const isDragging = ref(false); // Untuk indikator drag-over

const onFileChange = (event) => {
  const files = Array.from(event.target.files);
  updateSelectedFiles(files);
};

const onDragOver = (event) => {
  event.preventDefault(); // Penting: Mencegah perilaku default browser (membuka file)
  isDragging.value = true;
};

const onDragLeave = () => {
  isDragging.value = false;
};

const onDrop = (event) => {
  event.preventDefault(); // Penting: Mencegah perilaku default browser (membuka file)
  isDragging.value = false;
  const files = Array.from(event.dataTransfer.files).filter(file => file.type.startsWith('image/'));
  updateSelectedFiles(files);
};

const updateSelectedFiles = (files) => {
  selectedFiles.value = files.map(file => ({
    file: file,
    preview: URL.createObjectURL(file)
  }));
  results.value = []; // Bersihkan hasil sebelumnya
  errorMessage.value = ''; // Bersihkan error sebelumnya
};

const processStruks = async () => {
  if (selectedFiles.value.length === 0) {
    errorMessage.value = 'Silakan pilih setidaknya satu file gambar struk.';
    return;
  }

  loading.value = true;
  results.value = [];
  errorMessage.value = '';

  const formData = new FormData();
  selectedFiles.value.forEach(item => {
    formData.append('files', item.file); // 'files' harus sesuai dengan parameter di FastAPI
  });

  try {
    // Ganti URL ini dengan URL API FastAPI Anda yang sedang berjalan
    const response = await fetch('http://127.0.0.1:8000/struk-batch', {
      method: 'POST',
      body: formData,
    });

    if (!response.ok) {
      // Coba parse error response jika ada
      let errorData = {};
      try {
        errorData = await response.json();
      } catch (e) {
        // Jika respons bukan JSON
        errorData = { error: await response.text() };
      }
      throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
    }

    const data = await response.json();
    results.value = data;

  } catch (error) {
    console.error('Error:', error);
    errorMessage.value = `Terjadi kesalahan saat memproses: ${error.message}. Pastikan FastAPI Anda berjalan di http://127.0.0.1:8000 dan CORS sudah dikonfigurasi.`;
  } finally {
    loading.value = false;
  }
};

const formatCurrency = (amount) => {
  if (typeof amount !== 'number' || isNaN(amount)) return amount; // Handle non-numeric or NaN values
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  }).format(amount);
};
</script>
